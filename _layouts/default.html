<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1012">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ '/' | absolute_url }}">

  <!-- Link previews (LinkedIn, WhatsApp, Slack, etc.) -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ '/' | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zander Willoughby, peace and conflict researcher, Mariehamn, Åland">
  <meta property="profile:first_name" content="Zander">
  <meta property="profile:last_name" content="Willoughby">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/icons/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

  <link rel="preload" href="{{ '/assets/fonts/gloock-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/familjen-grotesk-var.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Zander Willoughby",
    "url": "{{ '/' | absolute_url }}",
    "image": "{{ '/assets/og-image.png' | absolute_url }}",
    "jobTitle": "Research Assistant",
    "worksFor": {
      "@type": "ResearchOrganization",
      "name": "Åland Islands Peace Institute",
      "alternateName": "Ålands fredsinstitut",
      "url": "https://www.peace.ax/"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Mariehamn",
      "addressRegion": "Åland",
      "addressCountry": "FI"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Uppsala University"
    },
    "knowsAbout": ["Peace and conflict research", "Climate security", "Gender and conflict", "Territorial autonomy", "Demilitarisation", "Nordic-Baltic security", "Unarmed civilian protection"],
    "knowsLanguage": ["en", "sv", "fr"],
    "sameAs": [
      "https://www.linkedin.com/in/zanderewilloughby/",
      "https://orcid.org/0009-0005-7079-0620",
      "https://github.com/ZEWilloughby"
    ]
  }
  </script>
</head>
<body>
  <main>
{{ content }}
  </main>
  <footer>© {{ 'now' | date: '%Y' }} {{ site.title }}</footer>
{%- if site.goatcounter and site.goatcounter != "" %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{%- endif %}
</body>
</html>
